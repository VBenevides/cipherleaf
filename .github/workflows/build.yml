name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  WAILS_VERSION: "v3.0.0-alpha2.112"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${APP_VERSION}"

          echo "VERSION=${APP_VERSION}"
          echo "TAG=${TAG}"
          echo "EXPECTED_TAG=${EXPECTED_TAG}"

          if [[ ! "${APP_VERSION}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid VERSION: ${APP_VERSION}"
            echo "Expected something like 0.1 or 0.1.0"
            exit 1
          fi

          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux amd64
    needs: validate
    runs-on: ubuntu-24.04

    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build
        run: wails3 build

      - name: Version binary
        run: |
          mv bin/cipherleaf "bin/cipherleaf-v${APP_VERSION}-linux-amd64"
          chmod +x "bin/cipherleaf-v${APP_VERSION}-linux-amd64"

      - uses: actions/upload-artifact@v4
        with:
          name: cipherleaf-v${{ env.APP_VERSION }}-linux-amd64
          path: bin/cipherleaf-v${{ env.APP_VERSION }}-linux-amd64
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs: validate
    runs-on: windows-latest

    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"

      - name: Build
        shell: pwsh
        run: wails3 build

      - name: Version binary
        shell: pwsh
        run: Move-Item bin/cipherleaf.exe "bin/cipherleaf-v$env:APP_VERSION-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cipherleaf-v${{ env.APP_VERSION }}-windows-amd64
          path: bin/cipherleaf-v${{ env.APP_VERSION }}-windows-amd64.exe
          if-no-files-found: error

  release:
    name: Release
    needs:
      - validate
      - linux
      - windows
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Cipherleaf v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: release/*