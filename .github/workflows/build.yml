name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "0.1"
  WAILS_VERSION: "v3.0.0-alpha2.112"

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: test "$(cat VERSION)" = "${APP_VERSION}"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build
        run: wails3 build

      - name: Version binary
        run: |
          mv bin/cipherleaf "bin/cipherleaf-v${APP_VERSION}-linux-amd64"
          tar -C bin -czf "bin/cipherleaf-v${APP_VERSION}-linux-amd64.tar.gz" \
            "cipherleaf-v${APP_VERSION}-linux-amd64"

      - uses: actions/upload-artifact@v4
        with:
          name: cipherleaf-v${{ env.APP_VERSION }}-linux-amd64
          path: bin/cipherleaf-v${{ env.APP_VERSION }}-linux-amd64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        run: |
          if ((Get-Content VERSION).Trim() -ne $env:APP_VERSION) {
            throw "VERSION does not match APP_VERSION"
          }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"

      - name: Build
        shell: pwsh
        run: wails3 build

      - name: Version binary
        shell: pwsh
        run: Move-Item bin/cipherleaf.exe "bin/cipherleaf-v$env:APP_VERSION-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cipherleaf-v${{ env.APP_VERSION }}-windows-amd64
          path: bin/cipherleaf-v${{ env.APP_VERSION }}-windows-amd64.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}" || {
            echo "Expected tag v${APP_VERSION}, got ${GITHUB_REF_NAME}"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Cipherleaf v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: release/*
