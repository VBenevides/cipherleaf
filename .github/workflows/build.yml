name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  WAILS_VERSION: "v3.0.0-alpha2.112"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag matches VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${APP_VERSION}"

          echo "VERSION=${APP_VERSION}"
          echo "TAG=${TAG}"
          echo "EXPECTED_TAG=${EXPECTED_TAG}"

          if [[ ! "${APP_VERSION}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid VERSION: ${APP_VERSION}"
            echo "Expected something like 0.1 or 0.1.0"
            exit 1
          fi

          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

  test:
    name: Release checks
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run Go tests
        run: go test ./...

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Run Go vet
        run: go vet ./...

      - name: Build production Go packages
        run: go build -tags production ./...

  linux:
    name: Linux amd64
    needs:
      - validate
      - test
    runs-on: ubuntu-24.04

    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build
        run: wails3 build

      - name: Version binary
        run: |
          mv bin/cipherleaf "bin/cipherleaf-v${APP_VERSION}-linux-amd64"
          chmod +x "bin/cipherleaf-v${APP_VERSION}-linux-amd64"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cipherleaf-v${{ env.APP_VERSION }}-linux-amd64
          path: bin/cipherleaf-v${{ env.APP_VERSION }}-linux-amd64
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs:
      - validate
      - test
    runs-on: windows-latest

    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"

      - name: Build
        shell: pwsh
        run: wails3 build

      - name: Version binary
        shell: pwsh
        run: Move-Item bin/cipherleaf.exe "bin/cipherleaf-v$env:APP_VERSION-windows-amd64.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cipherleaf-v${{ env.APP_VERSION }}-windows-amd64
          path: bin/cipherleaf-v${{ env.APP_VERSION }}-windows-amd64.exe
          if-no-files-found: error

  release:
    name: Release
    needs:
      - validate
      - linux
      - windows
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release
        run: sha256sum cipherleaf-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Cipherleaf v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          files: release/*
