name: SonarQube

on:
  push:
    branches:
      - main
      - "version/**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build frontend
        run: npm ci --ignore-scripts --prefix frontend && npm run build --prefix frontend

      - name: Generate Go coverage
        shell: bash
        run: |
          mkdir -p coverage
          GOCACHE="$RUNNER_TEMP/cipherleaf-go-cache" go test -coverpkg=./... -covermode=atomic -coverprofile=coverage/go.out ./...
          coverage=$(GOCACHE="$RUNNER_TEMP/cipherleaf-go-cache" go tool cover -func=coverage/go.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "Go line coverage %.1f%% is below 80%%\n", coverage; exit 1 } }'

      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
