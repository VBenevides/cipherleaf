name: Dependency security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "10 0 * * 1"

permissions:
  contents: read

jobs:
  security:
    name: Dependencies and SBOM
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: ${{ runner.temp }}/bin/govulncheck ./...

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/SBOM.spdx.json
          artifact-name: cipherleaf-sbom
          upload-release-assets: false

      - name: Validate SBOM
        env:
          SBOM_FILE: ${{ runner.temp }}/SBOM.spdx.json
        run: |
          test -s "$SBOM_FILE"
          jq -e '(.spdxVersion | strings) and (.packages | type == "array" and length > 0)' "$SBOM_FILE" >/dev/null
