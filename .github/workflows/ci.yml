name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npm run build --prefix frontend
      - name: Run Go coverage
        shell: bash
        run: |
          mkdir -p coverage
          go test -coverpkg=./... -covermode=atomic -coverprofile=coverage/go.out ./...
          coverage=$(go tool cover -func=coverage/go.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "Go line coverage %.1f%% is below 80%%\n", coverage; exit 1 } }'
      - name: Run frontend coverage
        run: npm run coverage --prefix frontend
